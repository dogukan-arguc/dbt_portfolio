version: 2

models:
  - name: stg_olist__customers
    description: staging layer for customers table.

    columns: 
      
      - name: customer_id
        description: "{{ doc('customer_id') }}"
        data_tests:
          - not_null
          - unique

      - name: customer_unique_id
        description: "{{ doc('customer_unique_id') }}"
        data_tests:
          - not_null

      - name: customer_zip_code_prefix
        description: "{{ doc('customer_zip_code_prefix') }}"
      
      - name: customer_city
        description: Customer's saved City.
      
      - name: customer_state
        description: Customer's saved State. It is valid for only Americas. Like TN, CH, LA etc.
  

  - name: stg_olist__geolocation
    description: geolocations table for zip codes.

    columns:

      - name: geolocation_zip_code_prefix
        description: "{{ doc('customer_zip_code_prefix') }}"
        data_tests:
          - not_null

      - name: geolocation_lat
        description: Latitude of the geographic location

      - name: geolocation_lng
        description: Longitude of the geographic location.

      - name: geolocation_city
        description: City of the geographic location.

      - name: geolocation_state
        description: State of the geographic location.
  

  - name: stg_olist__order_items
    description: Every items of the orders Table.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - order_id
              - order_item_id
          
    columns:

      - name: order_id
        description: "{{ doc('order_id') }}"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_olist__orders')
                field: order_id

      - name: order_item_id
        description: Every item in the order have unique order_item_id in that order.

      - name: product_id
        description: "{{ doc('product_id') }}"
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_olist__products')
                field: product_id
          - not_null

      - name: seller_id
        description: "{{ doc('seller_id') }}"
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_olist__sellers')
                field: seller_id
          - not_null

      - name: shipping_limit_timestamp
        description: Shipping limit of the order.
        data_tests:
          - assert_no_future_dates

      - name: order_item_price
        description: Price of the product.
        data_tests:
          - not_null
          - is_positive

      - name: order_item_freight_value
        description: Freight value of the product.


  - name: stg_olist__order_payments
    description: Payments done of the orders.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - order_id
              - payment_sequential

    columns:

      - name: order_id
        description: "{{ doc('order_id') }}" 
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_olist__orders')
                field: order_id

      - name: payment_sequential
        description: Sequential identifier indicating the order of the payment within the payment lifecycle.

      - name: payment_type
        description: credit_card / boleto / voucher / debit_card / not_defined
        data_tests:
          - accepted_values:
              arguments: 
                values: ['credit_card','boleto','voucher','debit_card','not_defined']
              config:
                # not_defined's are all cancelled orders. (3 rows)
                severity: error
      
      - name: payment_installments
        description: Installment number of the payment.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 36


      - name: payment_value
        description: Total payment value.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true


  - name: stg_olist__order_reviews
    description: Reviews of the orders. Every customer can review hers/his order once.

    columns:

      - name: review_id
        description: review identifier that customer did.
        data_tests:
          - unique: # This is duplicated rows. A customer can't send 2 reviews at the same exact time theorically. will solve in next step
              config:
                severity: warn
                store_failures: true
          - not_null

      - name: order_id
        description: "{{ doc('order_id') }}"
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_olist__orders')
                field: order_id

      - name: review_score
        description: score that customer gave to the order. It can be 1-5.
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                max_value: 5

      - name: review_comment_title
        description: Review title.
      
      - name: review_comment_message
        description: Review message of the customer.

      - name: review_creation_date
        description: Review creation date.
        data_tests:
          - assert_no_future_dates

      - name: review_answer_timestamp
        description: Review answer from the seller if he/she answered. Othervise it is null.
        data_tests:
          - assert_no_future_dates

  
  - name: stg_olist__orders
    description: All orders table.

    columns:

      - name: order_id
        description: "{{ doc('order_id') }}"
        data_tests:
          - unique
          - not_null

      - name: customer_id
        description: "{{ doc('customer_id') }}"
        data_tests:
          - relationships:
              to: ref('stg_olist__customers')
              field: customer_id

      - name: order_status
        description: The status of the order. It can be -> delivered, created, shipped, invoiced, unavailable, approved, processing, canceled.
        data_tests:
          - accepted_values:
              arguments:
                values: ["delivered", "created", "shipped", "invoiced", "unavailable", "approved", "processing", "canceled"]

      - name: order_purchase_timestamp
        description: order purchase exact time.
        data_tests:
          - assert_no_future_dates

      - name: order_approved_at_timestamp
        description: order approval exact time.
        data_tests:
          - assert_no_future_dates

      - name: order_delivered_carrier_timestamp
        description: Exact time of the carrier gets the order.
        data_tests:
          - assert_no_future_dates

      - name: order_delivered_customer_timestamp
        description: Exact time of the customer gets the order.
        data_tests:
          - assert_no_future_dates

      - name: order_estimated_delivery_date
        description: Estimated delivery date to the customer.

  
  - name: stg_olist__product_category_name_translation
    description: translation of the product categories from Portaguese to English.
    
    columns:

      - name: product_category_name
        description: Category name
        data_tests:
          - unique
          - not_null

      - name: product_category_name_english
        description: Category name in English.


  - name: stg_olist__products
    description: all products in the system.

    columns:

      - name: product_id
        description: "{{ doc('product_id') }}"
        data_tests:
          - unique
          - not_null

      - name: product_category_name
        description: Category name.
        data_tests:
          - relationships:
              arguments: # no translation for pc_gamer etc
                to: ref('stg_olist__product_category_name_translation')
                field: product_category_name
              config:
                severity: warn
                store_failures: true
          - not_null:
              config:
                severity: warn
                store_failures: true

      - name: product_name_length
        description: product name length.

      - name: product_description_length
        description: desc length.

      - name: product_photos_qty
        description: photo number of the product.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true

      - name: product_weight_g
        description: Gramage of the product weight.

      - name: product_length_cm
        description: length

      - name: product_height_cm
        description: height

      - name: product_width_cm
        description: width
  

  - name: stg_olist__sellers
    description: all sellers.

    columns:

      - name: seller_id
        description: "{{ doc('seller_id') }}"
        data_tests:
          - unique
          - not_null

      - name: seller_zip_code_prefix
        description: zip code of the seller

      - name: seller_city
        description: seller city
      
      - name: seller_state
        description: state of the seller.