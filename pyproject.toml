[project]
name = "olist-dbt-portfolio"
version = "0.1.0"
description = "Analytics engineering project on the Olist Brazilian E-Commerce dataset, built with dbt on DuckDB."
readme = "README.md"

# dbt-duckdb 1.10.1 publishes wheels for 3.10-3.13 only; 3.14 is not supported.
# .python-version pins day-to-day work to 3.12.
requires-python = ">=3.12,<3.14"

dependencies = [
    "dbt-core~=1.10.22",
    "dbt-duckdb~=1.10.1",
    "duckdb~=1.5.0",
]

[tool.uv]
# This repository is a dbt project, not an installable Python package.
package = false
